name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PHONE_KEYSTORE_BASE64 != '' }}
      PHONE_KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
      PHONE_KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Restore signing key from secrets
        if: env.HAS_KEY == 'true'
        env:
          PHONE_KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
        run: echo "$PHONE_KEYSTORE_BASE64" | base64 -d > app/phone.jks
      - name: Unit tests (T9 engine vs. original JavaScript output)
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Phone-release-apk
          path: app/build/outputs/apk/release/*.apk
