name: Release

# Run from the Actions tab (Run workflow). Builds the APK signed with your permanent key (from GitHub Secrets)
# and publishes it as a GitHub Release, so Phone.apk can be downloaded straight onto your phone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PHONE_KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
      PHONE_KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Restore signing key from secrets
        env:
          PHONE_KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PHONE_KEYSTORE_BASE64" ]; then
            echo "PHONE_KEYSTORE_BASE64 secret is missing. Add the 3 secrets first (see github-secrets.txt)."
            exit 1
          fi
          echo "$PHONE_KEYSTORE_BASE64" | base64 -d > app/phone.jks
      - name: Build signed release APK
        run: ./gradlew assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Phone.apk
          gh release create "build-${{ github.run_number }}" Phone.apk \
            --title "Phone build ${{ github.run_number }}" \
            --notes "Signed with the permanent Phone key. Installs over the previous build."
